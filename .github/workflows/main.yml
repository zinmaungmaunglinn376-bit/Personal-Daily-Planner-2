name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Project Files
        run: |
          mkdir -p build_workspace
          # First, check if user uploaded any zip files in repo or subdirs
          find . -maxdepth 3 -name "*.zip" -exec unzip -o "{}" -d build_workspace \; || true
          # If settings.gradle.kts isstill not in build_workspace, decode embedded source
          if [ ! -f "build_workspace/settings.gradle.kts" ]; then
            echo "" | base64 -d > build_workspace/source.zip
            unzip -o build_workspace/source.zip -d build_workspace
          fi
          # If the user modified index.html directly in the repo, copy it over so their edits take effect
          FoundIndex=$(find . -maxdepth 4 -path "./build_workspace*" -prune -o -name "index.html" -print | head -n 1)
          if [ -n "$FoundIndex" ]; then
            cp "$FoundIndex" build_workspace/app/src/main/assets/index.html
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: build_workspace
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Daily-Planner-APK
          path: build_workspace/app/build/outputs/apk/debug/app-debug.apk
